[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-suspension"
version = "0.1.0"
description = "Single-agent RL training scaffold for active suspension control."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "cvxpy>=1.4",
    "osqp>=0.6",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
export = [
    "onnx",
    "onnxruntime",
]

[project.scripts]
rl-suspension-production = "rl_suspension.production.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_suspension*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: short end-to-end imitation-learning smoke tests",
]
